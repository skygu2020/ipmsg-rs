[package]
name = "ipmsg-rs"
version = "0.7.1"
authors = ["wangyanqing@langzi.me"]
description = "ipmsg rewrite by rust."
repository = "https://github.com/langzime/raudient"
documentation = "https://docs.rs/raudient"
keywords = ["ipmsg", "ipmessager", "ipmsg-rs"]
license = "MIT"
edition = "2021"
rust-version = "1.92"

[[bin]]
name = "ipmsg-rs"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
hostname = "0.4"
# Keep the legacy encoding crate for its complete GB18030 support. Replacing it
# with a GBK-only codec would silently change IP Messenger wire compatibility.
encoding = "0.2"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
crossbeam-channel = "0.5"
combine = "4"
once_cell = "1"
gdk-pixbuf = "0.22"
human-panic = "2"
local-ip-address = "0.6"
async-channel = "2"

# Keep the gtk-rs family on matching releases. The API feature levels remain
# conservative so the application does not require the newest native GTK ABI.
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4"] }

[dependencies.gtk]
version = "0.11.5"
package = "gtk4"
features = ["v4_8"]

[dependencies.gdk]
version = "0.11.5"
package = "gdk4"

[dependencies.gio]
version = "0.22"
features = ["v2_70"]

[dependencies.glib]
version = "0.22"
features = ["v2_70"]

[dependencies.pango]
version = "0.22"
features = ["v1_50"]
